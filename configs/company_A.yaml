company_id: company_A
reporting_currency: ZAR
taxonomy_file: company_A/taxonomy_A.csv

sources:
  - name: erp
    file_path: company_A/erp_goods_receipts.csv
    id_column: line_id
    record_id_prefix: "ERP:"
    is_primary: true
    amount_type: net
    default_vat_rate: 0.0
    column_mapping:
      amount: value_zar
      date: posting_date
      currency: document_currency
      po_number: po_number
      supplier_name: supplier_name
      vendor_id: vendor_id
      item_description:
        - material_short_text
        - service_short_text
      material_number: material_number

  - name: invoice_tool
    file_path: company_A/invoice_tool_export.csv
    id_column: tool_record_id
    record_id_prefix: "TOOL:"
    is_primary: false
    amount_type: gross
    default_vat_rate: 0.15
    column_mapping:
      amount: gross_amount
      vat_rate: vat_rate
      date: invoice_date
      currency: currency
      po_reference: po_reference
      invoice_number: invoice_number
      supplier_name: supplier_name_as_captured
      item_description: line_text
      status: status

gating:
  approved_statuses:
    - paid
    - approved
  cancelled_statuses:
    - cancelled
    - canceled
    - void
  not_approved_statuses:
    - rejected
    - on hold
    - submitted
    - disputed

deduplication:
  enabled: true
  intra_system_dedup: true
  cross_system_linkage: true
  po_match_tolerance_abs: 1.0
  po_match_tolerance_pct: 0.02
  composite_date_window_days: 60
  composite_amount_tolerance_abs: 1.0

entity_resolution:
  supplier_similarity_threshold: 0.82
  item_similarity_threshold: 0.85
  blocking_prefix_len: 4

classifier:
  model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  batch_size: 256
  hybrid_alpha: 0.35
  temperature: 0.15
  use_few_shot: false

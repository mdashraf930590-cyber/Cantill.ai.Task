# ==============================================================================
# Cantill.ai Company Configuration Template (e.g. for Company C at Blind Test)
# Usage:
#   1. Copy this file to configs/company_C.yaml
#   2. Adjust column_mapping, taxonomy_file, and reporting_currency
#   3. Run: python3 run_pipeline.py --config configs/company_C.yaml --output submission/cantill__C.csv
# ==============================================================================

company_id: company_C
reporting_currency: USD
taxonomy_file: company_C/taxonomy_C.csv

sources:
  - name: invoice_lines
    file_path: company_C/invoice_lines.csv
    id_column: line_id
    record_id_prefix: ""
    is_primary: true
    amount_type: net  # 'net' or 'gross'
    default_vat_rate: 0.0
    column_mapping:
      amount: amount
      date: date
      currency: currency
      currency_rate: currency_rate
      supplier_name: supplier_name
      vendor_id: vendor_id
      item_description: item_description
      material_number: material_number
      po_number: po_number
      invoice_number: invoice_number
      status: status
      gl_account: gl_account
      gl_account_description: gl_account_description
      document_type: document_type

gating:
  approved_statuses:
    - paid
    - approved
    - posted
    - cleared
  cancelled_statuses:
    - cancelled
    - canceled
    - void
    - reversed
  not_approved_statuses:
    - rejected
    - on hold
    - submitted
    - disputed
    - pending
    - draft
  non_procurement_gl_prefixes:
    - "IC"
    - "I/C"
  non_procurement_gl_keywords:
    - "ic payables"
    - "i/c payable"
    - "intercompany"
    - "tax"
    - "taxes"
    - "gst"
    - "vat"
  non_procurement_desc_keywords:
    - "sales tax"
    - "state & local taxes"
    - "gst input tax"
    - "tax expense"
    - "taxes -"
    - "tax -"
    - "intercompany"
    - "royalty"
    - "royalties"
    - "dividend"
    - "financing fee"
    - "interest expense"
    - "bank charges"
    - "payroll"
    - "salary"
    - "wages"
    - "bad debt"
    - "depreciation"
    - "amortization"
  filter_zero_negative_offsets: true

deduplication:
  enabled: true
  intra_system_dedup: true
  cross_system_linkage: false

entity_resolution:
  supplier_similarity_threshold: 0.82
  item_similarity_threshold: 0.85
  blocking_prefix_len: 4

classifier:
  model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  batch_size: 256
  hybrid_alpha: 0.35
  temperature: 0.15
  use_few_shot: false  # Zero labels mode for unseen tree


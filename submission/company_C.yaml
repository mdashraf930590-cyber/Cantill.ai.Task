company_id: company_C
reporting_currency: USD
taxonomy_file: C/category_tree_C.csv

sources:
  - name: invoice_lines
    file_path: C/invoice_lines.csv
    id_column: line_id
    record_id_prefix: ""
    is_primary: true
    amount_type: net
    default_vat_rate: 0.0
    column_mapping:
      amount: line_amount_usd
      date: invoice_date
      supplier_name: supplier_name
      item_description:
        - product_service_description
        - line_description
        - invoice_description
      invoice_number: invoice_number
      status: status
      gl_account_description: gl_account_description

gating:
  approved_statuses:
    - approved
    - paid
    - posted
    - cleared
  cancelled_statuses:
    - cancelled
    - canceled
    - void
    - reversed
  not_approved_statuses:
    - rejected
    - on hold
    - submitted
    - disputed
    - pending
    - draft
  non_procurement_gl_prefixes:
    - "IC"
    - "I/C"
  non_procurement_gl_keywords:
    - "tax"
    - "taxes"
    - "royalty"
    - "royalties"
    - "revenue"
    - "rev."
    - "clearing"
    - "payable"
    - "donation"
    - "community giving"
    - "director fee"
    - "debt issuance"
    - "penalty"
    - "payroll"
    - "salary"
    - "bad debt"
    - "depreciation"
    - "amortization"
  non_procurement_desc_keywords:
    - "sales tax"
    - "state & local taxes"
    - "gst input tax"
    - "tax expense"
    - "intercompany"
    - "royalty"
    - "royalties"
    - "dividend"
    - "financing fee"
    - "interest expense"
  filter_zero_negative_offsets: true

deduplication:
  enabled: true
  intra_system_dedup: false
  cross_system_linkage: false

entity_resolution:
  supplier_similarity_threshold: 0.82
  item_similarity_threshold: 0.85
  blocking_prefix_len: 4

classifier:
  model_name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  batch_size: 256
  hybrid_alpha: 0.35
  temperature: 0.15
  use_few_shot: false
